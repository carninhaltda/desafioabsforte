<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>mockup calculadora</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1400px;height:875px;overflow:hidden;background:#07070a}
.cena{
  position:relative;width:1400px;height:875px;overflow:hidden;
  background:radial-gradient(76% 86% at 50% 44%, #1e1e26 0%, #131318 46%, #0A0A0C 100%);
}
.cena::before{
  content:"";position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
  width:1000px;height:760px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,51,102,.22) 0%, rgba(255,51,102,0) 64%);
}
.cena::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(7,7,10,.35) 0%, rgba(7,7,10,0) 26%, rgba(7,7,10,0) 72%, rgba(7,7,10,.62) 100%);
}
.palco{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform:scale(1.26);transform-origin:50% 44%}
.fone{
  position:relative;width:375px;height:770px;border-radius:44px;
  background:#101016;border:1px solid rgba(255,255,255,.16);
  padding:9px;overflow:hidden;
  box-shadow:0 70px 120px -40px rgba(0,0,0,.95), 0 0 0 1px rgba(255,255,255,.05) inset;
}
.fone iframe{width:357px;height:752px;border:0;border-radius:36px;display:block;background:#0A0A0C}
.fone::after{
  content:"";position:absolute;z-index:3;left:50%;top:9px;transform:translateX(-50%);
  width:108px;height:24px;border-radius:0 0 14px 14px;background:#101016;
}
.fone--tras{
  transform:translateX(62px) rotate(9deg) scale(.86);
  filter:brightness(.8) saturate(.95);
}
.fone--frente{
  transform:translateX(-58px) rotate(-4deg);
  z-index:2;
}
</style>
</head>
<body>
<div class="cena">
  <div class="palco">
    <div class="fone fone--tras"><iframe src="calc-topo.html" scrolling="no"></iframe></div>
    <div class="fone fone--frente"><iframe src="calc-resultado.html" scrolling="no"></iframe></div>
  </div>
</div>
</body>
</html>
