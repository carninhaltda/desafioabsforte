html,body{width:560px;height:784px;overflow:hidden;background:#07070a}
.capa{

  background:radial-gradient(78% 52% at 50% 30%, #23232c 0%, #121217 46%, #0A0A0C 100%);

}
.capa::before{
  content:"";position:absolute;left:50%;top:27%;transform:translate(-50%,-50%);

}
.capa::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(7,7,10,.35) 0%, rgba(7,7,10,0) 26%, rgba(7,7,10,0) 74%, rgba(7,7,10,.55) 100%);
